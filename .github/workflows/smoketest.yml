name: Smoketest

on:
  push:
    branches: ['2.*.x']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Scala version to test, e.g. 2.13.18
        required: true
      scala_sha:
        description: Full-length scala/scala commit SHA, to post the result as a commit status
  # scala-dist runs this after uploading a release
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      scala_sha:
        type: string
    secrets:
      SCALA_STATUS_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoketest:
    runs-on: ubuntu-latest
    env:
      version: ${{ inputs.version }}
      scala_sha: ${{ inputs.scala_sha }}
    steps:
      # when called from scala-dist, check out this repo rather than the caller's
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ !endsWith(github.repository, '/scala-dist-smoketest') && 'scala/scala-dist-smoketest' || '' }}
          ref: ${{ !endsWith(github.repository, '/scala-dist-smoketest') && '2.13.x' || '' }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 8
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
        with:
          # the cache is for sbt 2
          disk-cache: false
      - name: Post pending status
        env:
          SCALA_STATUS_TOKEN: ${{ secrets.SCALA_STATUS_TOKEN }}
        run: source scripts/common && postCommitStatus pending
      - run: scripts/jobs/release/smoketest
      - name: Post final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SCALA_STATUS_TOKEN: ${{ secrets.SCALA_STATUS_TOKEN }}
        run: source scripts/common && postCommitStatus "${JOB_STATUS/cancelled/error}"
