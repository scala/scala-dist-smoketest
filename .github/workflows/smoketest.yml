name: Smoketest

on:
  push:
    branches: ['2.*.x']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Scala version to test, e.g. 2.12.21
        required: true
      scala_sha:
        description: Full-length scala/scala commit SHA, to post the result as a commit status
  # scala-dist runs this after uploading a release
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      scala_sha:
        type: string
    secrets:
      SCALA_REPO_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoketest:
    runs-on: ubuntu-latest
    env:
      version: ${{ inputs.version }}
      scala_sha: ${{ inputs.scala_sha }}
      SCALA_REPO_TOKEN: ${{ secrets.SCALA_REPO_TOKEN }}
    steps:
      # when called from scala-dist, check out this repo rather than the caller's
      - uses: actions/checkout@v7
        with:
          repository: ${{ !endsWith(github.repository, '/scala-dist-smoketest') && 'scala/scala-dist-smoketest' || '' }}
          ref: ${{ !endsWith(github.repository, '/scala-dist-smoketest') && '2.12.x' || '' }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: sbt
      - uses: sbt/setup-sbt@v1
        with:
          # the cache is for sbt 2
          disk-cache: false
      - name: Post pending status
        run: source scripts/common && postCommitStatus pending
      - run: scripts/jobs/release/smoketest
      - name: Post final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: source scripts/common && postCommitStatus "${JOB_STATUS/cancelled/error}"
